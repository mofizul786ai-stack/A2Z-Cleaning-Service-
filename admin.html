<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2Z Admin - Photo Manager</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f8fafc; padding: 20px; color: #1e293b; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto 15px; }
    h2 { font-size: 18px; margin-bottom: 15px; color: #0879e8; }
    .upload-group { margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; }
    label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; }
    input[type="file"] { font-size: 13px; }
    .btn-reset { background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Photo Manager (A2Z Service)</h2>
    
    <div class="upload-group">
      <label>1. Main Top Banner Photo:</label>
      <input type="file" accept="image/*" onchange="uploadImage(event, 'img_banner')">
    </div>

    <div class="upload-group">
      <label>2. Cleaning Category Photo:</label>
      <input type="file" accept="image/*" onchange="uploadImage(event, 'img_cat_cleaning')">
    </div>

    <div class="upload-group">
      <label>3. Electrician Category Photo:</label>
      <input type="file" accept="image/*" onchange="uploadImage(event, 'img_cat_electrician')">
    </div>

    <div class="upload-group">
      <label>4. Plumber Category Photo:</label>
      <input type="file" accept="image/*" onchange="uploadImage(event, 'img_cat_plumber')">
    </div>

    <div class="upload-group">
      <label>5. Repair Category Photo:</label>
      <input type="file" accept="image/*" onchange="uploadImage(event, 'img_cat_repair')">
    </div>

    <div class="upload-group">
      <label>6. Sofa Deep Cleaning Photo:</label>
      <input type="file" accept="image/*" onchange="uploadImage(event, 'img_service_sofa')">
    </div>

    <button class="btn-reset" onclick="resetAllPhotos()">Reset All Original Photos</button>
  </div>

  <script>
    function uploadImage(event, key) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          localStorage.setItem(key, e.target.result);
          alert("Photo Updated Successfully!");
        };
        reader.readAsDataURL(file);
      }
    }

    function resetAllPhotos() {
      if (confirm("Are you sure you want to reset all photos to default?")) {
        const keys = ['img_banner', 'img_cat_cleaning', 'img_cat_electrician', 'img_cat_plumber', 'img_cat_repair', 'img_service_sofa'];
        keys.forEach(key => localStorage.removeItem(key));
        alert("All photos reset!");
      }
    }
  </script>
</body>
</html>
