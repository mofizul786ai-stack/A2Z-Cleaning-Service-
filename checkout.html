<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart & Address - A2Z Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding-bottom: 30px; }

    header {
      position: sticky; top: 0; z-index: 100; background: #ffffff;
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }
    .back-btn { font-size: 20px; text-decoration: none; color: #0f172a; font-weight: 800; }
    .page-title { font-size: 18px; font-weight: 800; color: #0f172a; }
    .close-btn { font-size: 18px; text-decoration: none; color: #0f172a; background: #f1f5f9; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }

    .container { padding: 16px; max-width: 500px; margin: 0 auto; }

    /* LOCATION & MAP BOX */
    .location-box { background: white; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .loc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .loc-title { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .btn-relo { background: #f0f7ff; color: #0879e8; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .detected-address { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 12px; line-height: 1.4; display: flex; align-items: flex-start; gap: 6px; }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .input-field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
    .input-field:focus { border-color: #0879e8; }

    .btn-proceed { width: 100%; background: #0879e8; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    .btn-proceed:disabled { background: #cbd5e1; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">←</a>
    <div class="page-title">Your cart</div>
    <a href="index.html" class="close-btn">✕</a>
  </header>

  <div class="container">
    
    <!-- LOCATION SECTION -->
    <div class="location-box">
      <div class="loc-header">
        <span class="loc-title">Select Delivery Location</span>
        <button class="btn-relo" onclick="getUserLocation()">📍 Locate Me</button>
      </div>

      <div class="detected-address">
        <span>📍</span>
        <span id="locStatus">Fetching current location...</span>
      </div>

      <form id="addressForm" onsubmit="saveAddressAndProceed(event)">
        <div class="input-group">
          <input type="text" id="autoAddress" class="input-field" placeholder="Detected Area / Road Name" required>
        </div>

        <div class="input-group">
          <input type="text" id="houseNo" class="input-field" placeholder="House/Flat Number*" required>
        </div>

        <div class="input-group">
          <input type="text" id="landmark" class="input-field" placeholder="Landmark (Optional)">
        </div>

        <button type="submit" id="submitBtn" class="btn-proceed" disabled>Save and proceed to slots</button>
      </form>
    </div>

  </div>

  <script>
    // AUTOMATIC GEOLOCATION FETCH
    function getUserLocation() {
      const locStatus = document.getElementById('locStatus');
      const autoAddressInput = document.getElementById('autoAddress');
      const submitBtn = document.getElementById('submitBtn');

      locStatus.innerText = "Fetching GPS Location...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // REVERSE GEOCODING VIA OPENSTREETMAP API (FREE & NO API KEY NEEDED)
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
              .then(res => res.json())
              .then(data => {
                if (data && data.display_name) {
                  const fullAddr = data.display_name;
                  locStatus.innerText = fullAddr;
                  autoAddressInput.value = fullAddr;
                  submitBtn.disabled = false;
                } else {
                  locStatus.innerText = "Location found (Enter landmark manually)";
                  autoAddressInput.value = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                  submitBtn.disabled = false;
                }
              })
              .catch(err => {
                locStatus.innerText = "Location detected. Please enter area name.";
                submitBtn.disabled = false;
              });
          },
          function(error) {
            locStatus.innerText = "Please allow location access or type address manually.";
            submitBtn.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        locStatus.innerText = "Geolocation is not supported by your browser.";
        submitBtn.disabled = false;
      }
    }

    function saveAddressAndProceed(e) {
      e.preventDefault();
      const userAddress = {
        area: document.getElementById('autoAddress').value,
        houseNo: document.getElementById('houseNo').value,
        landmark: document.getElementById('landmark').value
      };
      
      localStorage.setItem('a2z_user_address', JSON.stringify(userAddress));
      alert("Address saved successfully!");
      // NEXT STEP NAVIGATION (e.g., slot-booking.html)
    }

    document.addEventListener("DOMContentLoaded", function() {
      getUserLocation();
    });
  </script>
</body>
</html>
