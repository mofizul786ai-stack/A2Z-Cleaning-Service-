<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - A2Z Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 16px; padding-bottom: 40px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-back { text-decoration: none; font-size: 20px; color: #0f172a; font-weight: bold; }
    .page-title { font-size: 18px; font-weight: 800; color: #0879e8; }
    
    /* CLEAR ALL BUTTON */
    .btn-clear-all { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .container { max-width: 500px; margin: 0 auto; }

    .cart-item {
      background: white; border-radius: 12px; padding: 14px;
      margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
      border: 1px solid #e2e8f0;
    }
    .item-info { font-weight: 700; font-size: 14px; }
    .item-price { color: #0879e8; font-weight: 800; font-size: 15px; margin-top: 4px; }
    
    /* DELETE ITEM BUTTON */
    .btn-remove {
      background: #f1f5f9; color: #ef4444; border: none;
      width: 32px; height: 32px; border-radius: 8px;
      font-weight: bold; cursor: pointer; font-size: 16px;
    }

    .empty-msg { text-align: center; padding: 40px 0; color: #64748b; font-weight: 600; }
    
    .total-box {
      background: white; border-radius: 12px; padding: 16px; margin-top: 20px;
      border: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-weight: 800; font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="index.html" class="btn-back">←</a>
      <h1 class="page-title">Your Cart</h1>
      <button class="btn-clear-all" onclick="clearAllCart()">Clear All</button>
    </header>

    <div id="cartList"></div>
    
    <div id="totalBox" class="total-box" style="display: none;">
      <span>Total Amount:</span>
      <span id="totalPrice" style="color: #0879e8;">₹0</span>
    </div>
  </div>

  <script>
    function renderCart() {
      let cart = JSON.parse(localStorage.getItem('a2z_cart')) || [];
      const listContainer = document.getElementById('cartList');
      const totalBox = document.getElementById('totalBox');
      
      if (cart.length === 0) {
        listContainer.innerHTML = `<div class="empty-msg">Your cart is empty!</div>`;
        totalBox.style.display = 'none';
        return;
      }

      let html = '';
      let total = 0;

      cart.forEach((item, index) => {
        total += item.priceNum;
        html += `
          <div class="cart-item">
            <div>
              <div class="item-info">${item.title}</div>
              <div class="item-price">₹${item.priceNum}</div>
            </div>
            <button class="btn-remove" onclick="removeItem(${index})">✕</button>
          </div>
        `;
      });

      listContainer.innerHTML = html;
      document.getElementById('totalPrice').innerText = `₹${total}`;
      totalBox.style.display = 'flex';
    }

    // single item delete function
    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('a2z_cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('a2z_cart', JSON.stringify(cart));
      renderCart();
    }

    // all items delete function
    function clearAllCart() {
      if(confirm("Are you sure you want to clear all items?")) {
        localStorage.removeItem('a2z_cart');
        renderCart();
      }
    }

    document.addEventListener("DOMContentLoaded", renderCart);
  </script>
</body>
</html>
