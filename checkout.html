<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - A2Z Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding-bottom: 40px; }

    header {
      position: sticky; top: 0; z-index: 100; background: #ffffff;
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }
    .back-btn { font-size: 20px; text-decoration: none; color: #0f172a; font-weight: 800; }
    .page-title { font-size: 18px; font-weight: 800; color: #0f172a; }
    .close-btn { font-size: 18px; text-decoration: none; color: #0f172a; background: #f1f5f9; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }

    .container { padding: 16px; max-width: 500px; margin: 0 auto; }

    .card-box { background: white; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .card-head { font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; }
    .cart-item:last-child { border-bottom: none; }
    .item-name { font-size: 14px; font-weight: 700; color: #1e293b; }
    .item-price { font-size: 14px; font-weight: 800; color: #0879e8; margin-right: 10px; }
    .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
    .cart-total { margin-top: 12px; padding-top: 10px; border-top: 2px solid #f1f5f9; display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; color: #0f172a; }

    .btn-relo { background: #f0f7ff; color: #0879e8; border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .detected-address { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 12px; line-height: 1.4; display: flex; align-items: flex-start; gap: 6px; }
    
    .input-group { margin-bottom: 12px; }
    .input-row { display: flex; gap: 8px; }
    .input-field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
    .input-field:focus { border-color: #0879e8; }

    .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .slot-btn { background: #f8fafc; border: 1px solid #cbd5e1; padding: 10px 6px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 700; color: #334155; }
    .slot-btn.active { background: #0879e8; color: white; border-color: #0879e8; }

    .pay-option { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-size: 14px; font-weight: 700; }
    .pay-option input { width: 18px; height: 18px; accent-color: #0879e8; }

    .btn-proceed { width: 100%; background: #0879e8; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">←</a>
    <div class="page-title">Checkout</div>
    <a href="index.html" class="close-btn">✕</a>
  </header>

  <div class="container">
    
    <!-- 1. SELECTED SERVICES -->
    <div class="card-box">
      <div class="card-head">
        <span>Selected Services</span>
        <span id="itemCountBadge" style="font-size: 12px; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 10px;">0 Items</span>
      </div>
      <div id="cartItemsList"></div>
      <div class="cart-total">
        <span>Total Amount</span>
        <span id="cartTotalPrice">₹0</span>
      </div>
    </div>

    <form id="checkoutForm" onsubmit="handleFinalBooking(event)">
      
      <!-- 2. CONTACT & FULL ADDRESS SECTION -->
      <div class="card-box">
        <div class="card-head">
          <span>Contact & Delivery Address</span>
          <button type="button" class="btn-relo" onclick="getUserLocation()">📍 Locate Me</button>
        </div>
        
        <div class="detected-address">
          <span>📍</span>
          <span id="locStatus">Getting live location...</span>
        </div>

        <!-- Phone Number -->
        <div class="input-group">
          <input type="tel" id="userPhone" class="input-field" placeholder="Mobile Number*" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <!-- House / Flat No -->
        <div class="input-group">
          <input type="text" id="houseNo" class="input-field" placeholder="House / Flat / Building No.*" required>
        </div>

        <!-- Auto/Street Address -->
        <div class="input-group">
          <input type="text" id="autoAddress" class="input-field" placeholder="Street / Area Name*" required>
        </div>

        <!-- Landmark & Pincode -->
        <div class="input-group input-row">
          <input type="text" id="landmark" class="input-field" placeholder="Landmark (Optional)">
          <input type="text" id="pincode" class="input-field" placeholder="Pincode*" maxlength="6" pattern="[0-9]{6}" required>
        </div>
      </div>

      <!-- 3. DATE SELECTION -->
      <div class="card-box">
        <div class="card-head">Select Service Date</div>
        <div class="slot-grid" id="dateGrid"></div>
      </div>

      <!-- 4. TIME SLOT SELECTION -->
      <div class="card-box">
        <div class="card-head">Select Time Slot</div>
        <div class="slot-grid">
          <div class="slot-btn time-slot" onclick="selectTime(this)">09:00 AM</div>
          <div class="slot-btn time-slot" onclick="selectTime(this)">11:00 AM</div>
          <div class="slot-btn time-slot" onclick="selectTime(this)">01:00 PM</div>
          <div class="slot-btn time-slot" onclick="selectTime(this)">03:00 PM</div>
          <div class="slot-btn time-slot" onclick="selectTime(this)">05:00 PM</div>
        </div>
      </div>

      <!-- 5. PAYMENT OPTIONS -->
      <div class="card-box">
        <div class="card-head">Payment Method</div>
        
        <label class="pay-option">
          <input type="radio" name="payment" value="UPI / Online" checked>
          <span>📲 Pay via UPI / Online (GPay, PhonePe, Paytm)</span>
        </label>
        
        <label class="pay-option">
          <input type="radio" name="payment" value="Cash on Service">
          <span>💵 Cash on Service (Pay after work)</span>
        </label>
      </div>

      <button type="submit" class="btn-proceed">Confirm & Book Service</button>
    </form>

  </div>

  <script>
    let selectedDate = '';
    let selectedTime = '';

    function renderCartItems() {
      let cart = JSON.parse(localStorage.getItem('a2z_cart')) || [];
      const listContainer = document.getElementById('cartItemsList');
      const totalEl = document.getElementById('cartTotalPrice');
      const badgeEl = document.getElementById('itemCountBadge');

      if (cart.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:15px; font-size:13px;">Your cart is empty!</div>`;
        totalEl.innerText = "₹0";
        badgeEl.innerText = "0 Items";
        return;
      }

      let html = '';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.priceNum;
        html += `
          <div class="cart-item">
            <div class="item-name">${item.title}</div>
            <div style="display:flex; align-items:center;">
              <span class="item-price">₹${item.priceNum}</span>
              <button class="btn-delete" onclick="deleteCartItem(${index})" type="button">🗑️ Delete</button>
            </div>
          </div>
        `;
      });
      listContainer.innerHTML = html;
      totalEl.innerText = `₹${total}`;
      badgeEl.innerText = `${cart.length} Item${cart.length > 1 ? 's' : ''}`;
    }

    function deleteCartItem(index) {
      let cart = JSON.parse(localStorage.getItem('a2z_cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('a2z_cart', JSON.stringify(cart));
      renderCartItems();
    }

    function generateDates() {
      const dateGrid = document.getElementById('dateGrid');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      let html = '';
      
      for (let i = 0; i < 3; i++) {
        let d = new Date();
        d.setDate(d.getDate() + i);
        let dayName = i === 0 ? 'Today' : (i === 1 ? 'Tomorrow' : days[d.getDay()]);
        let dateStr = `${d.getDate()} ${d.toLocaleString('default', { month: 'short' })}`;
        
        html += `<div class="slot-btn date-slot ${i === 0 ? 'active' : ''}" onclick="selectDate(this, '${dayName}, ${dateStr}')">${dayName}<br><small>${dateStr}</small></div>`;
        if (i === 0) selectedDate = `${dayName}, ${dateStr}`;
      }
      dateGrid.innerHTML = html;
    }

    function selectDate(el, val) {
      document.querySelectorAll('.date-slot').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      selectedDate = val;
    }

    function selectTime(el) {
      document.querySelectorAll('.time-slot').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      selectedTime = el.innerText;
    }

    function getUserLocation() {
      const locStatus = document.getElementById('locStatus');
      const autoAddressInput = document.getElementById('autoAddress');
      const pincodeInput = document.getElementById('pincode');
      locStatus.innerText = "Fetching current location...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)
              .then(res => res.json())
              .then(data => {
                let locName = [data.locality || data.city, data.principalSubdivision].filter(Boolean).join(', ');
                locStatus.innerText = locName || "Location Detected";
                autoAddressInput.value = locName || "";
                if (data.postcode) pincodeInput.value = data.postcode;
              })
              .catch(() => {
                locStatus.innerText = "Agamoni, Dhubri, Assam";
                autoAddressInput.value = "Agamoni, Dhubri, Assam";
              });
          },
          function() {
            locStatus.innerText = "Agamoni, Dhubri, Assam";
            autoAddressInput.value = "Agamoni, Dhubri, Assam";
          }
        );
      }
    }

    function handleFinalBooking(e) {
      e.preventDefault();
      let cart = JSON.parse(localStorage.getItem('a2z_cart')) || [];
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      if (!selectedTime) {
        alert("Please select a Time Slot!");
        return;
      }

      const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
      const orderData = {
        id: "ORD" + Date.now(),
        items: cart,
        phone: document.getElementById('userPhone').value,
        fullAddress: `${document.getElementById('houseNo').value}, ${document.getElementById('autoAddress').value}, ${document.getElementById('landmark').value || ''} - ${document.getElementById('pincode').value}`,
        date: selectedDate,
        time: selectedTime,
        payment: paymentMethod,
        status: "Booked"
      };

      let orders = JSON.parse(localStorage.getItem('a2z_orders_list')) || [];
      orders.push(orderData);
      localStorage.setItem('a2z_orders_list', JSON.stringify(orders));

      localStorage.removeItem('a2z_cart');
      alert(`🎉 Order Booked Successfully!\n\nOrder ID: ${orderData.id}\nPhone: ${orderData.phone}\nDate: ${selectedDate}\nTime: ${selectedTime}`);
      window.location.href = "orders.html";
    }

    document.addEventListener("DOMContentLoaded", function() {
      renderCartItems();
      generateDates();
      getUserLocation();
    });
  </script>
</body>
            </html>
