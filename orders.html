<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - A2Z Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 16px; padding-bottom: 80px; }

    .container { max-width: 500px; margin: 0 auto; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-back { text-decoration: none; font-size: 20px; color: #0f172a; font-weight: bold; }
    .page-title { font-size: 18px; font-weight: 800; color: #0879e8; }
    .btn-clear { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

    /* ORDER CARD */
    .order-card {
      background: white; border-radius: 16px; padding: 18px;
      margin-bottom: 14px; border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
    .order-id { font-size: 14px; font-weight: 800; color: #0f172a; }
    .badge-status { background: #dcfce7; color: #15803d; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    .order-item-title { font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 4px; }
    .order-meta { font-size: 12px; color: #64748b; margin-top: 8px; line-height: 1.5; }
    
    .order-total { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e2e8f0; font-weight: 800; font-size: 15px; color: #0879e8; }

    .empty-msg { text-align: center; padding: 60px 0; color: #64748b; font-weight: 600; }

    /* BOTTOM NAV */
    .bottom-nav { 
      position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; 
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 0 10px; border-top: 1px solid #e2e8f0; z-index: 1000; 
    }
    .nav-item { 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; gap: 2px; flex: 1;
    }
    .nav-item span:first-child { font-size: 20px; line-height: 1; }
    .nav-item.active { color: #0879e8; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="index.html" class="btn-back">←</a>
      <h1 class="page-title">My Orders</h1>
      <button class="btn-clear" onclick="clearOrders()">Clear History</button>
    </header>

    <div id="ordersList"></div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span><span>Home</span></a>
    <a href="orders.html" class="nav-item active"><span>📋</span><span>Orders</span></a>
    <a href="categories.html" class="nav-item"><span>🔳</span><span>Categories</span></a>
    <a href="profile.html" class="nav-item"><span>👤</span><span>Profile</span></a>
  </nav>

  <script>
    function renderOrders() {
      let orders = JSON.parse(localStorage.getItem('a2z_orders')) || [];
      const listContainer = document.getElementById('ordersList');

      if (orders.length === 0) {
        listContainer.innerHTML = `<div class="empty-msg">No previous orders found!</div>`;
        return;
      }

      let html = '';
      
      // নতুন অর্ডারগুলো ওপরে দেখানোর জন্য উল্টে নেওয়া হচ্ছে
      [...orders].reverse().forEach(order => {
        let itemsList = order.items && Array.isArray(order.items) 
          ? order.items.map(i => i.title).join(', ') 
          : 'Service Order';

        let id = order.orderId || 'A2Z-' + Math.floor(1000 + Math.random() * 9000);
        let date = order.bookingDate || 'N/A';
        let time = order.bookingTime ? `(${order.bookingTime})` : '';
        let address = order.address || 'Address Not Provided';
        let total = order.totalAmount || order.total || 0;
        let status = order.status || 'Pending';

        html += `
          <div class="order-card">
            <div class="order-header">
              <span class="order-id">ID: ${id}</span>
              <span class="badge-status">${status}</span>
            </div>
            <div class="order-item-title">📦 ${itemsList}</div>
            <div class="order-meta">
              📅 Date: <b>${date}</b> ${time}<br>
              📍 Address: ${address}
            </div>
            <div class="order-total">
              <span>Total Paid/Due:</span>
              <span>₹${total}</span>
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function clearOrders() {
      if(confirm("Are you sure you want to clear all order history?")) {
        localStorage.removeItem('a2z_orders');
        renderOrders();
      }
    }

    document.addEventListener("DOMContentLoaded", renderOrders);
  </script>
</body>
</html>
