<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - A2Z Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding-bottom: 40px; }

    header {
      position: sticky; top: 0; z-index: 100; background: #ffffff;
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }
    .back-btn { font-size: 20px; text-decoration: none; color: #0f172a; font-weight: 800; }
    .page-title { font-size: 18px; font-weight: 800; color: #0f172a; }

    .container { padding: 16px; max-width: 500px; margin: 0 auto; }

    .empty-box { text-align: center; color: #94a3b8; padding: 60px 20px; font-size: 15px; font-weight: 600; }
    
    .order-card {
      background: #ffffff; border-radius: 16px; padding: 16px;
      border: 1px solid #e2e8f0; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px; }
    .order-id { font-size: 13px; font-weight: 800; color: #0f172a; }
    
    .status-badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
    .status-pending { background: #fef9c3; color: #854d0e; }
    .status-confirmed { background: #dcfce7; color: #166534; }
    .status-completed { background: #e0f2fe; color: #0369a1; }

    .order-info { font-size: 13px; color: #475569; margin-bottom: 6px; line-height: 1.4; }
    .order-info strong { color: #0f172a; }

    .service-box { background: #f8fafc; border-radius: 10px; padding: 10px; margin: 10px 0; font-size: 13px; }
    .service-item { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; color: #334155; }
    .service-item:last-child { margin-bottom: 0; }

    .order-total { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; border-top: 1px solid #f1f5f9; padding-top: 10px; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">←</a>
    <div class="page-title">My Orders</div>
    <div style="width: 20px;"></div>
  </header>

  <div class="container" id="customerOrdersList">
    <!-- Orders will render here -->
  </div>

  <script>
    function renderCustomerOrders() {
      const container = document.getElementById('customerOrdersList');
      let orders = JSON.parse(localStorage.getItem('a2z_orders_list')) || [];

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="empty-box">
            <p>You haven't placed any orders yet!</p>
            <a href="index.html" style="display:inline-block; margin-top:12px; color:#0879e8; font-weight:800; text-decoration:none;">Explore Services</a>
          </div>
        `;
        return;
      }

      let html = '';
      // Reverse to show latest orders first
      orders.slice().reverse().forEach(order => {
        let status = order.status || 'Pending';
        let statusClass = 'status-pending';
        if (status === 'Confirmed') statusClass = 'status-confirmed';
        if (status === 'Completed') statusClass = 'status-completed';

        let itemsHtml = '';
        let total = 0;
        if (order.items && Array.isArray(order.items)) {
          order.items.forEach(item => {
            total += item.priceNum;
            itemsHtml += `
              <div class="service-item">
                <span>• ${item.title}</span>
                <span>₹${item.priceNum}</span>
              </div>
            `;
          });
        }

        html += `
          <div class="order-card">
            <div class="order-head">
              <span class="order-id">ID: ${order.id}</span>
              <span class="status-badge ${statusClass}">${status}</span>
            </div>

            <div class="order-info"><strong>Date & Time:</strong> ${order.date} at ${order.time}</div>
            <div class="order-info"><strong>Address:</strong> ${order.fullAddress}</div>
            <div class="order-info"><strong>Payment:</strong> ${order.payment}</div>

            <div class="service-box">
              ${itemsHtml}
            </div>

            <div class="order-total">
              <span>Total Bill</span>
              <span style="color:#0879e8;">₹${total}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", renderCustomerOrders);
  </script>
</body>
</html>
